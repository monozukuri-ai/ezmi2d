[[required_corpus]]
id = "standalone-bi-generation-matrix"
status = "blocking public standalone .bi compatibility claim"
purpose = "Determine generation-specific compressed MI wrappers and verify exact logical MI equivalence"
producer_generations = [
  "HP ME10 legacy generation",
  "CoCreate or OneSpace Designer Drafting generation",
  "Creo Elements/Direct Drafting current generation",
]
required_artifacts = [
  "same drawing saved separately as standalone .mi and .bi",
  "producer product name, exact version, platform, and save options",
  "container and logical SHA-256 plus byte sizes",
  "content signature and decompressor identity",
  "Japanese text, dimensions, tolerance, hatch, and nested/shared parts",
]
required_validation = [
  "signature classification before decompression",
  "logical MI byte equivalence or documented canonical differences",
  "semantic model equivalence between .mi and .bi",
  "decompressed-size and compression-ratio limits",
  "truncation, checksum, trailing-data, and multi-stream behavior",
]
provenance_requirement = "Record source URL or custodian, acquisition date, and producer evidence"
license_requirement = "Record license and explicit redistribution permission separately for every artifact"
repository_policy = "metadata and checksums only; binaries stay under gitignored samples/external unless redistribution is explicitly permitted"
